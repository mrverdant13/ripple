name: discovery_workspace

packages:
  include:
    - packages/**
    - tool
  exclude:
    - '**/example'
    - '**/example/**'
    - '**/fixtures/**'
    - '**/mold/**'
  groups:
    core:
      - packages/core
    libs:
      - packages/*
    tooling:
      - tool
  filtersPresets:
    withTestDir:
      - dirExists: [test]
    libsOnly:
      - group: libs
    libsWithTest:
      - preset: libsOnly
      - dirExists: [test]

# Probe lives at repo test/helpers/probe.dart (two levels above this fixture).
scripts:
  root.pwd:
    run: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart cwd
  root.env:
    run: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env-root-only
  root.subst:
    run: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write $RIPPLE_ROOT_PATH
  root.steps:
    run:
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write first-
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write second
  root.steps.fail:
    run:
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write-then-exit before- 7
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write after
  pkg.name:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
  pkg.env:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_ROOT_PATH RIPPLE_PACKAGE_PATH RIPPLE_PACKAGE_NAME
  pkg.subst:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write $RIPPLE_PACKAGE_NAME
  pkg.fail:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart fail-if RIPPLE_PACKAGE_NAME=core --exit 3 --print-env RIPPLE_PACKAGE_NAME
  pkg.steps:
    exec:
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write $RIPPLE_PACKAGE_NAME-
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write step2
  pkg.steps.fail:
    exec:
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart fail-if RIPPLE_PACKAGE_NAME=core --exit 5 --print-env RIPPLE_PACKAGE_NAME
      - dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart write should-not-run
  pkg.filtered:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    filters:
      - dirExists: [test]
  pkg.preset:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    filters:
      - preset: withTestDir
  pkg.dependents:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    filters:
      - match: [core]
    dependentsFilters: []
  pkg.dependencies:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    filters:
      - match: [app]
    dependenciesFilters: []
  pkg.dependents.constrained:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    filters:
      - match: [core]
    dependentsFilters:
      - match: [ui]
  pkg.dependents.env:
    exec: dart $RIPPLE_ROOT_PATH/../../helpers/probe.dart env RIPPLE_PACKAGE_NAME
    dependentsFilters: []
