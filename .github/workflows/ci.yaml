name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  min-conditions:
    name: Check format and analyze codebase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart run bin/ripple.dart run format.ci

      - name: Analyze
        run: dart run bin/ripple.dart run analyze.ci

  min-sdk-consumer:
    name: Min-SDK consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.5.0

      - name: Run min-SDK consumer smoke
        working-directory: e2e/min_sdk_smoke
        run: |
          dart pub get
          dart run ripple_cli:ripple --help
          dart run ripple_cli:ripple list

  test:
    name: Test implementation
    needs: min-conditions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Test
        run: dart run bin/ripple.dart run test.ci
